<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>A Question Under The Stars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #0a0b1e;
    --bg-deep-2: #12142f;
    --gold: #e8b75d;
    --gold-soft: #f4d59a;
    --periwinkle: #8c9eff;
    --text-light: #f5f3ed;
    --muted: #9296b4;
    --line: rgba(232,183,93,0.35);
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at 50% 20%, var(--bg-deep-2), var(--bg-deep) 70%);
    color: var(--text-light);
    font-family:'Inter', sans-serif;
    overflow: hidden;
  }

  canvas#stars{
    position:fixed; inset:0; width:100%; height:100%; z-index:0;
  }

  .stage{
    position:relative; z-index:2;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding: 24px;
    transition: opacity 0.6s ease;
  }
  .stage.stage-hidden{
    opacity:0;
    pointer-events:none;
  }

  .constellation{
    position:fixed;
    top:8%; left:50%; transform:translateX(-50%);
    width:min(520px, 80vw);
    opacity:0.9;
    pointer-events:none;
    z-index:1;
  }
  .constellation path{
    fill:none;
    stroke: var(--line);
    stroke-width:1;
    stroke-linecap:round;
    stroke-dasharray: 900;
    stroke-dashoffset: 900;
    animation: draw 3.2s ease-out forwards 0.3s;
  }
  .constellation circle{
    fill: var(--gold-soft);
    opacity:0;
    animation: fadeStar 0.6s ease-out forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes fadeStar{ to{ opacity:0.85; } }

  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color: var(--periwinkle);
    margin-bottom:22px;
    opacity:0;
    animation: riseIn 0.8s ease-out forwards 0.2s;
  }

  .headline{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size: clamp(2.4rem, 6vw, 4.4rem);
    line-height:1.08;
    margin: 0 0 18px;
    letter-spacing:0.005em;
    background: linear-gradient(180deg, #fffdf6 0%, var(--gold-soft) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:0;
    animation: riseIn 0.9s ease-out forwards 0.45s;
  }

  .sub{
    font-size:15px;
    color: var(--muted);
    max-width: 420px;
    margin: 0 0 52px;
    font-style: italic;
    opacity:0;
    animation: riseIn 0.9s ease-out forwards 0.7s;
  }
  .sub span{ color: var(--text-light); font-style:normal; }

  .actions{
    position:relative;
    display:flex; gap:22px; align-items:center; justify-content:center;
    flex-wrap:wrap;
    opacity:0;
    animation: riseIn 0.9s ease-out forwards 0.95s;
    min-height: 64px;
  }

  .btn{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:15px;
    padding:16px 34px;
    border-radius:999px;
    cursor:pointer;
    border:1px solid transparent;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.4s ease, font-size 0.3s ease, padding 0.3s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:focus-visible{
    outline: 2px solid var(--periwinkle);
    outline-offset: 3px;
  }

  .btn-yes{
    background: linear-gradient(135deg, var(--gold) 0%, #d99a3d 100%);
    color: #1a1206;
    box-shadow: 0 8px 30px rgba(232,183,93,0.28);
  }
  .btn-yes:hover{ transform: translateY(-2px) scale(1.02); box-shadow: 0 12px 36px rgba(232,183,93,0.4); }

  .btn-no{
    position: relative;
    background: transparent;
    color: var(--muted);
    border-color: rgba(146,150,180,0.4);
  }
  .btn-no.moving{
    position: fixed;
    z-index: 5;
  }

  .hint{
    margin-top:26px;
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.05em;
    color: var(--periwinkle);
    min-height: 16px;
    opacity:0.85;
  }

  /* meteor shower */
  .meteor{
    position:fixed; top:-10px; z-index:4;
    width:2px; height:110px;
    background: linear-gradient(180deg, rgba(245,243,237,0), var(--gold-soft) 60%, #fff);
    transform-origin: top center;
    opacity:0;
    pointer-events:none;
  }

  /* reveal */
  .reveal{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    opacity:0; visibility:hidden;
    transition: opacity 0.9s ease;
    background: rgba(10,11,30,0.28);
    overflow: hidden;
  }
  .reveal.show{ opacity:1; visibility:visible; }

  .heart-rain{
    position:fixed; inset:0; z-index:9;
    pointer-events:none;
    overflow:hidden;
    opacity:0;
    transition: opacity 0.6s ease;
  }
  .heart-rain.show{ opacity:1; }
  .heart-rain span{
    position:absolute;
    top:-10vh;
    will-change: transform, opacity;
    animation: fall linear forwards;
  }
  @keyframes fall{
    0%{ transform: translateY(-10vh) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:1; }
    100%{ transform: translateY(110vh) translateX(var(--drift, 0px)) rotate(360deg); opacity:0.85; }
  }

  .reveal-card{
    position: relative;
    z-index: 2;
    text-align:center;
    max-width: 480px;
    padding: 44px 40px;
    border-radius: 24px;
    background: rgba(18,20,47,0.55);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(232,183,93,0.18);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    transform: translateY(14px);
    opacity:0;
    transition: transform 0.9s ease 0.15s, opacity 0.9s ease 0.15s;
  }
  .reveal.show .reveal-card{ transform:translateY(0); opacity:1; }

  .dancing-emojis{
    position:absolute; inset:0; z-index:1;
    pointer-events:none;
  }
  .dancing-emojis span{
    position:absolute;
    font-size: 28px;
    opacity:0;
    animation: dance 3.4s ease-in-out infinite, emojiFadeIn 0.6s ease-out forwards;
  }
  @keyframes dance{
    0%, 100%{ transform: translateY(0) rotate(-8deg) scale(1); }
    25%{ transform: translateY(-22px) rotate(6deg) scale(1.08); }
    50%{ transform: translateY(-8px) rotate(-4deg) scale(0.98); }
    75%{ transform: translateY(-28px) rotate(10deg) scale(1.05); }
  }
  @keyframes emojiFadeIn{ to{ opacity:0.9; } }

  .reveal-eyebrow{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.32em;
    color: var(--gold);
    margin-bottom:18px;
  }
  .reveal-card h2{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    margin: 0 0 20px;
    color: var(--text-light);
  }
  .reveal-card p{
    color: var(--muted);
    font-size:16px;
    line-height:1.7;
    margin: 0;
  }

  @keyframes riseIn{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  @media (max-width: 480px){
    .btn{ padding:14px 26px; font-size:14px; }
  }

  .footer{
    position:fixed;
    left:0; right:0; bottom:22px;
    z-index:3;
    text-align:center;
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:0.05em;
    color: var(--muted);
    opacity:0;
    animation: riseIn 0.9s ease-out forwards 1.2s;
  }
  .heart-icon{
    color: var(--gold);
    margin: 0 4px;
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<svg class="constellation" viewBox="0 0 500 160" xmlns="http://www.w3.org/2000/svg">
  <path d="M 40 120 L 120 60 L 210 90 L 300 40 L 380 70 L 460 30" />
  <circle cx="40" cy="120" r="2.4" style="animation-delay:0.4s"/>
  <circle cx="120" cy="60" r="2.4" style="animation-delay:0.9s"/>
  <circle cx="210" cy="90" r="2.4" style="animation-delay:1.4s"/>
  <circle cx="300" cy="40" r="2.4" style="animation-delay:1.9s"/>
  <circle cx="380" cy="70" r="2.4" style="animation-delay:2.4s"/>
  <circle cx="460" cy="30" r="2.4" style="animation-delay:2.9s"/>
</svg>

<div class="heart-rain" id="heartRain"></div>

<!--
  OPTIONAL: to play your own song on reveal, put an mp3 file named
  "song.mp3" in the SAME FOLDER as this HTML file. If it's missing,
  a short built-in chime plays instead — nothing will be silent.
-->
<audio id="bgSong" preload="auto" loop>
  <source src="song.mpeg" type="audio/mpeg">
</audio>

<main class="stage" id="stage">
  <div class="eyebrow">A question, under the stars</div>
  <h1 class="headline">Enteh,Let's Go for a Walk? Seriously</h1>
  <p class="sub">— from <span id="askerName">Silhfen tha chhuan tur reng neilo.🥹</span></p>

  <div class="actions">
    <button class="btn btn-yes" id="yesBtn">Yes,A teuh reng mai</button>
    <button class="btn btn-no" id="noBtn">No</button>
  </div>
  <div class="hint" id="hintText">&nbsp;</div>
</main>

<section class="reveal" id="reveal">
  <div class="dancing-emojis" id="dancingEmojis">
    <span style="left:12%; top:18%; animation-delay:0.1s;">💕</span>
    <span style="left:82%; top:15%; animation-delay:0.4s;">🫯</span>
    <span style="left:8%; top:70%; animation-delay:0.7s;">💝</span>
    <span style="left:88%; top:68%; animation-delay:0.2s;">🥺</span>
    <span style="left:20%; top:85%; animation-delay:0.9s;">❤️</span>
    <span style="left:75%; top:88%; animation-delay:0.5s;">🩷</span>
    <span style="left:50%; top:8%; animation-delay:1.1s;">🫠</span>
    <span style="left:45%; top:92%; animation-delay:0.3s;">😊</span>
  </div>
  <div class="reveal-card">
    <div class="reveal-eyebrow">You're Booked😉🫠</div>
    <h2>I knew it.</h2>
    <p id="revealMessage">Hman nghal mai lo mi.
      #Chapal bun aa hman nghal.🫠</p>
  </div>
</section>

<div class="footer">
  <span class="heart-icon">♥</span> Made with love By Tej Chinzah <span class="heart-icon">♥</span>
</div>

<script>

const ASKER_NAME   = "Silhfen tha chhuan tur reng neilo.🥹"; // shown under the headline
const YES_MESSAGE  = "Hman nghal mai lo mi.
  #Chapal bun aa hman nghal.🫠";
/* ============================================ */

document.getElementById('askerName').textContent = ASKER_NAME;
document.getElementById('revealMessage').textContent = YES_MESSAGE;

/* ---------- starfield ---------- */
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let W, H, stars = [];

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  const count = Math.floor((W * H) / 9000);
  stars = Array.from({length: count}, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.3 + 0.3,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.015 + 0.005
  }));
}
window.addEventListener('resize', resize);
resize();

function drawStars(t){
  ctx.clearRect(0, 0, W, H);
  for(const s of stars){
    const twinkle = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(245,243,237,${0.15 + twinkle * 0.6})`;
    ctx.fill();
  }
  requestAnimationFrame(drawStars);
}
requestAnimationFrame(drawStars);

/* ---------- dodging "No" button ---------- */
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const hintText = document.getElementById('hintText');
const stageEl = document.getElementById('stage');
const hints = [
  "No? Really🙄",
  "Oh💔Shrinking, but my hope for you isn't.",
  "Keep pressing — I'll wait for you.",
  "Getting smaller, But feelings get bigger.",
  "The yes button suits you better anyway.",
  "Almost gone, but i will not.",
  "You're stubborn — that's one more thing I like.",
  "Va han ngai tak che emm🫠.",
  "one more press and I'm all in.",
  "Okay, I surrender. it was always a yes,tho."
];
 

let clickCount = 0;
const MAX_CLICKS = hints.length;

function shrinkNoBtn(){
  if(clickCount >= MAX_CLICKS) return;
  clickCount++;

  const scale = Math.max(1 - clickCount * 0.09, 0.12);
  noBtn.style.transform = `scale(${scale})`;

  hintText.textContent = hints[clickCount - 1];

  const yesScale = Math.min(1 + clickCount * 0.03, 1.25);
  yesBtn.style.transform = `scale(${yesScale})`;

  if(clickCount >= MAX_CLICKS){
    setTimeout(() => {
      noBtn.style.opacity = '0';
      setTimeout(() => { noBtn.style.display = 'none'; }, 400);
    }, 700);
  }
}

noBtn.style.transition = 'transform 0.3s ease, opacity 0.4s ease';
noBtn.addEventListener('click', (e) => {
  e.preventDefault();
  shrinkNoBtn();
});
noBtn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  shrinkNoBtn();
}, { passive: false });

/* ---------- background song (or fallback chime) ---------- */
const bgSong = document.getElementById('bgSong');

function fadeInAudio(audio, target){
  audio.volume = 0;
  const steps = 20;
  let i = 0;
  const iv = setInterval(() => {
    i++;
    audio.volume = Math.min(target, (i / steps) * target);
    if(i >= steps) clearInterval(iv);
  }, 40);
}

function playFallbackChime(){
  try{
    const ctx2 = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99, 1046.5]; // a soft C major arpeggio
    notes.forEach((freq, i) => {
      const osc = ctx2.createOscillator();
      const gain = ctx2.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const start = ctx2.currentTime + i * 0.18;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.18, start + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 1.1);
      osc.connect(gain).connect(ctx2.destination);
      osc.start(start);
      osc.stop(start + 1.2);
    });
  }catch(e){ /* audio not available, fail silently */ }
}

/* ---------- yes click: song + meteor shower + reveal ---------- */
yesBtn.addEventListener('click', () => {
  stageEl.classList.add('stage-hidden');
  fireMeteors();

  // start playback right inside the click so browsers don't block it
  bgSong.currentTime = 0;
  const playPromise = bgSong.play();
  if(playPromise && playPromise.then){
    playPromise.then(() => fadeInAudio(bgSong, 0.55)).catch(() => playFallbackChime());
  } else {
    playFallbackChime();
  }

  setTimeout(() => {
    document.getElementById('reveal').classList.add('show');
    startHeartRain();
  }, 550);
});

/* ---------- love-colored heart rain ---------- */
const heartRainEl = document.getElementById('heartRain');
const loveColors = ['#ff4d6d', '#ff8fa3', '#f72585', '#c77dff', '#e8b75d', '#ff6b81', '#ffb3c6', '#b298dc'];
let heartRainInterval = null;

function spawnHeart(){
  const span = document.createElement('span');
  span.textContent = '❤';
  const left = Math.random() * 100;
  const size = 14 + Math.random() * 18;
  const duration = 4.5 + Math.random() * 3.5;
  const drift = (Math.random() - 0.5) * 160;
  span.style.left = left + 'vw';
  span.style.fontSize = size + 'px';
  span.style.color = loveColors[Math.floor(Math.random() * loveColors.length)];
  span.style.animationDuration = duration + 's';
  span.style.setProperty('--drift', drift + 'px');
  span.style.filter = 'drop-shadow(0 0 6px rgba(255,255,255,0.15))';
  heartRainEl.appendChild(span);
  setTimeout(() => span.remove(), duration * 1000 + 200);
}

function startHeartRain(){
  if(heartRainInterval) return;
  heartRainEl.classList.add('show');
  for(let i = 0; i < 8; i++){ setTimeout(spawnHeart, i * 120); }
  heartRainInterval = setInterval(spawnHeart, 220);
}

function fireMeteors(){
  const count = 14;
  for(let i = 0; i < count; i++){
    setTimeout(() => {
      const m = document.createElement('div');
      m.className = 'meteor';
      const startX = Math.random() * window.innerWidth;
      const angle = 18 + Math.random() * 10;
      m.style.left = startX + 'px';
      m.style.transform = `rotate(${angle}deg)`;
      document.body.appendChild(m);

      m.animate([
        { transform: `translateY(-10px) rotate(${angle}deg)`, opacity: 0 },
        { transform: `translateY(40px) rotate(${angle}deg)`, opacity: 1, offset: 0.15 },
        { transform: `translateY(${window.innerHeight + 100}px) rotate(${angle}deg)`, opacity: 0 }
      ], { duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.3,.6,.4,1)' });

      setTimeout(() => m.remove(), 1500);
    }, i * 90);
  }
}
</script>

</body>
</html>
